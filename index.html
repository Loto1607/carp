<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carp World Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
 --bg:#EAF0EC;--surface:#FFFFFF;--surface2:#F2F6F3;--ink:#13231F;--muted:#566A64;--line:#CAD7D1;
 --w1:#8FD0DD;--w2:#2F8EA5;--bank:#A9C79A;--reed:#6E9A5E;
 --cro:#D3132F;--croSoft:#FBE3E6;--A:#C98204;--B:#23855A;--C:#6F52BE;--up:#16834A;--down:#C2303F;--gold:#B98A10;
 color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0C1614;--surface:#15221E;--surface2:#1C2C27;--ink:#E5EFEB;--muted:#93A8A1;--line:#2A3D37;
 --w1:#1F6475;--w2:#0B3240;--bank:#3B5734;--reed:#5E8550;
 --cro:#FF4F61;--croSoft:#45161D;--A:#F0B13A;--B:#4CC383;--C:#A68BF0;--up:#4CC383;--down:#FF6B78;--gold:#F0C24A;
 color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0C1614;--surface:#15221E;--surface2:#1C2C27;--ink:#E5EFEB;--muted:#93A8A1;--line:#2A3D37;
 --w1:#1F6475;--w2:#0B3240;--bank:#3B5734;--reed:#5E8550;
 --cro:#FF4F61;--croSoft:#45161D;--A:#F0B13A;--B:#4CC383;--C:#A68BF0;--up:#4CC383;--down:#FF6B78;--gold:#F0C24A;
 color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,"Segoe UI",sans-serif;font-size:16px;line-height:1.4}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:14px 16px;margin-top:10px;font-size:1.05rem;font-weight:600;background:var(--cro);color:#fff}
.btn.sec{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}

/* role */
#role{min-height:100%;display:grid;place-items:center;padding:24px}
.rcard{max-width:520px;width:100%;text-align:center}
.rcard h1{font-family:"Barlow Condensed",sans-serif;font-size:2.6rem;margin:0;line-height:1}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.rbtns button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:22px 10px;font-size:1.15rem;font-weight:600}
.rbtns button span{display:block;font-size:2.4rem}

/* ---------- TV ---------- */
#tv{height:100vh;display:grid;grid-template-columns:minmax(0,2.75fr) minmax(0,.95fr) repeat(3,minmax(0,.6fr));grid-template-rows:auto auto minmax(0,1fr);gap:1vh 1.2vw;padding:1.4vh 1.4vw;font-size:2vh;overflow:hidden}
.tvhead{grid-column:1/-1;display:flex;align-items:center;gap:1.4vw;min-width:0}
.tvhead .brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:3.6vh;line-height:1;white-space:nowrap}
.tvhead .brand small{display:block;font-size:1.7vh;font-weight:500;color:var(--muted)}
.tvclock{display:flex;align-items:center;gap:1vw;margin-left:auto}
.tvhour{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:6.4vh;line-height:.9}
.tvperiod{font-size:2vh;color:var(--muted);line-height:1.15;white-space:nowrap}
.conn{display:flex;align-items:center;gap:.6vw;font-size:1.8vh;padding:.5vh .9vw;border-radius:99px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.conn i{width:1.3vh;height:1.3vh;border-radius:50%;background:var(--down)}
.conn.on i{background:var(--up)}
.crohead{display:flex;gap:.6vw;min-width:0}
.crohead div{background:var(--surface);border:1px solid var(--line);border-radius:1.2vh;padding:.5vh .8vw;line-height:1.15;white-space:nowrap}
.crohead .lead{background:var(--croSoft);border-color:var(--cro)}
.crohead b{font-family:"Barlow Condensed",sans-serif;font-size:3vh;color:var(--cro);margin-right:.4vw}
.crohead span{font-size:1.6vh;color:var(--muted)}
.crohead div:not(.lead) b{color:var(--ink);font-size:2.6vh}
.crohead em{display:block;font-style:normal;font-size:1.5vh;font-weight:600;color:var(--muted)}
.crohead em.ok{color:var(--up)}
.tvbars{grid-column:1/-1}
.hours{display:flex;gap:.25vw}
.hours span{flex:1;height:.7vh;border-radius:2px;background:var(--line)}
.hours span.n{background:color-mix(in srgb,var(--w2) 55%,var(--line))}
.hours span.done{background:var(--ink);opacity:.5}
.hours span.now{background:var(--cro);opacity:1}
.progress{height:.45vh;background:var(--line);border-radius:2px;overflow:hidden;margin-top:.5vh}
.progress i{display:block;height:100%;width:0;background:var(--gold)}
.tvmap{min-height:0;display:flex;flex-direction:column;gap:1vh;position:relative}
.mapwrap{flex:1;min-height:0;background:var(--bank);border-radius:1.6vh;overflow:hidden;border:1px solid var(--line);display:flex}
.mapwrap svg{width:100%;height:100%;display:block}
.tvticker{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6vh;overflow:hidden}
.tvticker h2{font-family:"Barlow Condensed",sans-serif;font-size:2.4vh;margin:.4vh 0 0}
.tvticker div{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:1.2vh;padding:.5vh .8vw;font-size:1.7vh;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvticker div.cro{border-color:var(--cro)}
.tvticker b{font-family:"Barlow Condensed",sans-serif;font-size:2.6vh;margin-right:.6vw}
.tvside{display:contents}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:1.4vh;padding:.9vh .7vw;min-height:0;overflow:hidden}
.panel h2{font-family:"Barlow Condensed",sans-serif;margin:0 0 .4vh;font-size:2.4vh;line-height:1;display:flex;align-items:center;gap:.5vw}
.panel h2 i{display:inline-block;width:1.2vh;height:1.2vh;border-radius:50%}

table{width:100%;border-collapse:collapse}
#tv table{font-size:1.42vh;line-height:1.2;table-layout:fixed;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
#tv td{padding:.2vh .2vw}
#tv th{padding:0 .2vw .2vh}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.85em;padding:0 .3vw .2vh}
td{padding:.12vh .3vw;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.r,th.r{text-align:right}
#tv table.nat col.c4{width:3em}#tv table.nat col.c5{width:4em}
#tv col.c1{width:1.7em}#tv col.c2{width:2.7em}#tv col.c4{width:2.4em}#tv col.c5{width:3.4em}
tr.cro td{background:var(--croSoft);font-weight:600}
tr.cro td.name{color:var(--cro)}
tr.gap td{border-top:none;text-align:center;color:var(--muted);padding:0;line-height:.9}
.rk{font-family:"Barlow Condensed",sans-serif;font-weight:700}
.dl{font-size:.85em}
.dl.u{color:var(--up)}.dl.d{color:var(--down)}.dl.z{color:var(--muted)}
.fl{display:inline-block;width:2vh;height:1.35vh;vertical-align:-.15vh;margin-right:.35vw;border-radius:2px;overflow:hidden}
@media (prefers-reduced-motion:no-preference){tr.flash td{animation:fl 1.6s ease-out}}
@keyframes fl{from{background:color-mix(in srgb,var(--gold) 45%,transparent)}}
.qrfloat{position:absolute;left:1vw;bottom:1vh;z-index:2;box-shadow:0 1vh 3vh rgba(0,0,0,.4)}
.qrbox{display:flex;flex-direction:column;gap:1vh;align-items:center;text-align:center}
.qrbox #qr{background:#fff;padding:.7vh;border-radius:1vh;line-height:0}
.qrbox #qr img,.qrbox #qr canvas{width:14vh!important;height:14vh!important}
.qrbox p{margin:.3vh 0;font-size:1.8vh}
.code{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4.6vh;letter-spacing:.2em;line-height:1}
.tvmsg{position:fixed;inset:auto 0 4vh;display:flex;justify-content:center;pointer-events:none;z-index:4}
.tvmsg div{background:var(--ink);color:var(--surface);padding:1.4vh 2vw;border-radius:1.4vh;font-size:2.6vh;font-weight:600}
.final{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 90%,transparent);display:grid;place-items:center;z-index:5}
.final .box{background:var(--surface);border:1px solid var(--line);border-radius:3vh;padding:4vh 4vw;text-align:center;min-width:50vw}
.final h1{font-family:"Barlow Condensed",sans-serif;font-size:7vh;margin:0}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.5vw;margin:3vh 0}
.podium div{background:var(--surface2);border-radius:2vh;padding:2vh 1vw;font-size:2.4vh}
.podium b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:4.4vh}

/* map svg */
#lake{transition:fill .8s}
#map.night #lake{fill:url(#wgn)}
.peg circle{stroke:var(--surface);stroke-width:2}
.peg text.n{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;fill:#fff;text-anchor:middle;dominant-baseline:central}
.peg.cro circle{stroke:#fff;stroke-width:3}
.flag{transform-box:fill-box;transform-origin:center;transition:transform .35s cubic-bezier(.2,1.5,.4,1)}
.fbox{fill:none;stroke:rgba(0,0,0,.4);stroke-width:.8}
.peg.cro .fbox{stroke:var(--cro);stroke-width:2.5}
.peg.hit .flag{transform:scale(1.9);filter:drop-shadow(0 0 4px #fff)}
.peg.hit .fbox{stroke:#fff;stroke-width:1.6}
.ccode{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;fill:#fff;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#1d3318;stroke-width:3.2px;stroke-linejoin:round}
.peg.cro .ccode{fill:#fff;stroke:var(--cro)}
.seclabel{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;text-anchor:middle;dominant-baseline:central;opacity:.7}
.ripple{fill:none;stroke:#fff;stroke-width:2;transform-box:fill-box;transform-origin:center;animation:rip 1.6s ease-out forwards}
.ripple.d{animation-delay:.25s;opacity:0}
@keyframes rip{0%{transform:scale(.2);opacity:.95}100%{transform:scale(3.2);opacity:0}}
.jump{animation:jump 1.4s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes jump{0%{transform:translateY(8px) scale(.6) rotate(-20deg);opacity:0}25%{opacity:1}55%{transform:translateY(-26px) scale(1.15) rotate(15deg)}100%{transform:translateY(4px) scale(.8) rotate(40deg);opacity:0}}
.badge{animation:badge 4.8s ease-out forwards;transform-box:fill-box;transform-origin:center}
.badge rect{stroke:#fff;stroke-width:1.5}
.badge.s rect{fill:#2F6FDB}.badge.m rect{fill:#16834A}.badge.l rect{fill:#C98A04}
.badge.cro rect{stroke:var(--cro);stroke-width:3}
.badge text{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;fill:#fff;text-anchor:middle;dominant-baseline:central}
@keyframes badge{0%{opacity:0;transform:scale(.5)}8%{opacity:1;transform:scale(1.12)}14%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.ripple,.jump,.badge{animation-duration:.01s}.flag{transition:none}}

/* ---------- MOBITEL ---------- */
#mob{max-width:560px;margin:0 auto;padding:12px 14px 40px}
.mtop{position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0 8px;display:flex;align-items:center;gap:10px}
.mtop .h{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.2rem;line-height:1}
.mtop .p{font-size:.85rem;color:var(--muted);line-height:1.15}
.mtop .conn{margin-left:auto;font-size:.85rem;padding:4px 10px}
.mtop .conn i{width:10px;height:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.card h2{font-family:"Barlow Condensed",sans-serif;font-size:1.35rem;margin:0 0 6px}
.codein{display:flex;gap:8px;margin-top:8px}
.codein input{flex:1;font-size:1.6rem;letter-spacing:.2em;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2)}
.codein .btn{width:auto;margin:0}
.team{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.team:first-of-type{border-top:none;margin-top:0;padding-top:0}
.thead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.tname{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.2rem;color:var(--cro)}
.tmeta{font-size:.85rem;color:var(--muted)}
.rod{display:grid;grid-template-columns:56px 1fr auto;gap:8px;align-items:center;margin-top:6px}
.rod label{font-size:.9rem;color:var(--muted)}
.rod input{width:100%;padding:11px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:1.1rem}
.rod .ok{border:none;border-radius:10px;background:var(--ink);color:var(--surface);padding:11px 14px;font-weight:600}
.rod .done{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;border-radius:10px;background:var(--croSoft);font-weight:600;grid-column:2/4}
.rod .done button{border:none;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline}
.rod .wait{grid-column:2/4;padding:10px;color:var(--muted)}
.err{color:var(--down);font-size:.85rem;min-height:1em;margin:2px 0 0 64px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.summary div{background:var(--surface2);border-radius:10px;padding:8px;text-align:center;line-height:1.2}
.summary b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.5rem}
.summary span{font-size:.78rem;color:var(--muted)}
#mob table{font-size:.92rem}
#mob td{padding:5px 6px}
.poslist{display:grid;gap:6px;margin-top:8px}
.poslist div{background:var(--croSoft);border-radius:10px;padding:8px 10px;color:var(--cro);font-weight:600}
.poslist span{color:var(--ink);font-weight:400}
.teampick{display:grid;gap:8px;margin-top:8px}
.teampick button{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:14px;text-align:left;font-weight:600;font-size:1.05rem}
.teampick button span{display:block;font-weight:400;font-size:.85rem;color:var(--muted)}
.teampick button.cro{color:var(--cro)}
.teampick button{position:relative}
.teampick button.sel{border:2px solid var(--cro);background:var(--croSoft)}
.teampick button.sel::after{content:"✓";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:1.4rem;color:var(--cro)}
.readylist{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.readylist div{background:var(--surface2);border-radius:10px;padding:8px 6px;text-align:center;font-size:.85rem;line-height:1.25}
.readylist div.ok{background:color-mix(in srgb,var(--up) 18%,var(--surface2));color:var(--up);font-weight:600}
.linkbtn{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem;padding:0}
</style>
</head>
<body>
<section id="role" hidden>
 <div class="rcard">
  <div style="font-size:3rem">🎣</div>
  <h1>Carp World Cup</h1>
  <p class="muted">Na kojem ste uređaju?</p>
  <div class="rbtns">
   <button id="pickTv"><span>📺</span>Televizor<br><small class="muted">karta i poredak</small></button>
   <button id="pickMob"><span>📱</span>Mobitel<br><small class="muted">upis i upravljanje</small></button>
  </div>
 </div>
</section>

<section id="tv" hidden>
 <div class="tvhead">
  <div class="brand">Carp World Cup<small>Svjetsko prvenstvo u ribolovu šarana</small></div>
  <div class="crohead" id="tvCro"></div>
  <div class="tvclock"><div class="conn" id="tvConn"><i></i><span>Mobitel nije spojen</span></div><div class="tvhour num" id="tvHour">12h</div><div class="tvperiod" id="tvPeriod">Prije starta</div></div>
 </div>
 <div class="tvbars"><div class="hours" id="tvHours"></div><div class="progress"><i id="tvProg"></i></div></div>
 <div class="tvmap">
  <div class="mapwrap"><svg id="map" viewBox="0 -15 1000 1150" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Karta jezera"></svg></div>
  <div class="tvticker" id="tvTicker" hidden></div>
  <div class="panel qrfloat" id="tvQr">
   <div class="qrbox"><div id="qr"></div><div><p>Skenirajte mobitelom ili upišite kod:</p><div class="code num" id="tvCode">-----</div><p class="muted" id="tvNet">Spajanje na mrežu…</p></div></div>
  </div>
 </div>
 <div class="tvside">
  <div class="panel"><h2>Poredak država</h2><div id="tvN"></div></div>
  <div class="panel"><h2><i style="background:var(--A)"></i>Sektor A</h2><div id="tvA"></div></div>
  <div class="panel"><h2><i style="background:var(--B)"></i>Sektor B</h2><div id="tvB"></div></div>
  <div class="panel"><h2><i style="background:var(--C)"></i>Sektor C</h2><div id="tvC"></div></div>
 </div>
 <div class="tvmsg" id="tvMsg" hidden><div></div></div>
 <div class="final" id="tvFinal" hidden></div>
</section>

<section id="mob" hidden>
 <div class="mtop"><div><div class="h num" id="mHour">–</div><div class="p" id="mPeriod">Nije spojeno</div></div><div class="conn" id="mConn"><i></i><span>Nije spojeno</span></div></div>
 <div id="mBody"></div>
</section>

const score=(c,night)=>night?(10-(+c.slice(3,5))/10)*(9-(+c[2])):(10-(+c[0]))*(9-(+c[2]));
const AVG={};for(const p in PEGS){AVG[p]=[0,1].map(n=>{let s=0;PEGS[p].forEach(r=>r.forEach(c=>s+=score(c,!!n)));return s/48})}
const cell=(peg,rod)=>PEGS[peg][rod[1]-1][rod[0]-1];
let S=null,timer=null;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){
  for(let tries=0;tries<200000;tries++){
    const secs=[0,1,2].map(s=>shuffle(Array.from({length:30},(_,i)=>s*30+i+1)));
    let ok=true;
    for(let c=0;c<30&&ok;c++)if(new Set(secs.map(s=>pegOf(s[c]))).size<3)ok=false;
    if(ok){const teams=[];for(let c=0;c<30;c++)for(let s=0;s<3;s++){const lake=secs[s][c];teams.push({id:teams.length,c,n:s+1,lake,peg:pegOf(lake),sec:SECT[s],cpu:c!==0,rods:null})}return teams}
  }
}
function castRods(keep){const rods=keep.slice();while(rods.length<3){const r=[rnd(12),rnd(4)];if(!rods.some(x=>x[0]===r[0]&&x[1]===r[1]))rods.push(r)}return rods}
function simulateHour(h){
  const night=isNight(h),events=[];
  for(const t of S.teams){
    if(!t.cpu)continue;
    if(!t.rods)t.rods=castRods([]);
    const caught=[false,false,false];
    t.rods.forEach((rod,i)=>{const c=cell(t.peg,rod),thr=night?+c.slice(3,5):+c.slice(0,2);
      if(pctDie()>=thr&&rnd(8)>=+c[2]){const kg=rnd(20)+((rnd(10)-1)*10+(rnd(10)-1))/100;caught[i]=true;events.push({t:t.id,kg:Math.round(kg*100)/100,rod:i+1})}});
    if(h<23){const nn=isNight(h+1),avg=AVG[t.peg][nn?1:0];t.rods=castRods(t.rods.filter((rod,i)=>!caught[i]&&score(cell(t.peg,rod),nn)>=avg))}
  }
  const byTeam={};events.forEach(e=>(byTeam[e.t]=byTeam[e.t]||[]).push(e));
  Object.values(byTeam).forEach(list=>{const span=(list.length-1)*GAP,t0=1200+Math.random()*Math.max(0,ROUND_MS-2500-span);shuffle(list).forEach((e,i)=>e.at=t0+i*GAP)});
  return events.sort((a,b)=>a.at-b.at);
}
function saveState(){store(KEY_STATE,S)}
function newGame(){stopTimer();S={phase:"drawn",hour:-1,teams:draw(),catches:[],pending:[],startedAt:0,snaps:[]};tickerItems=[];lastRanks={};saveState()}
function startHour(h){S.hour=h;S.phase="hour";S.ready={1:false,2:false,3:false};S.readySince=0;S.snaps[h]=rankSnapshot();S.pending=simulateHour(h);S.startedAt=Date.now();saveState();runTimer()}
function finishHour(){
  S.pending.forEach(e=>applyCatch(e,false));S.pending=[];
  if(S.hour>=23){S.phase="done";stopTimer();saveState();return}
  startHour(S.hour+1);
}
function applyCatch(e,animate){
  S.catches.push({t:e.t,h:S.hour,kg:e.kg,rod:e.rod});
  if(animate)animateCatch(S.teams[e.t],e.kg);
  tickerItems.unshift({t:e.t,kg:e.kg,h:S.hour});tickerItems=tickerItems.slice(0,8);
}
function runTimer(){
  stopTimer();
  const tick=()=>{
    const el=Date.now()-S.startedAt;let changed=false;
    while(S.pending.length&&S.pending[0].at<=el){applyCatch(S.pending.shift(),true);changed=true}
    $("tvProg").style.width=Math.min(100,el/ROUND_MS*100)+"%";
    if(changed){saveState();renderTvData();broadcastSoon()}
    if(allReady()&&!S.pending.length){
      if(!S.readySince)S.readySince=Date.now();
      if(Date.now()-S.readySince>2000){finishHour();if(S.phase==="done")toast("Natjecanje je završeno");else toast(`Počinje ${HOURS[S.hour]}`);renderTv();broadcast();return}
    } else if(el>=ROUND_MS&&!S.pending.length){stopTimer();$("tvProg").style.width="100%";broadcastSoon()}
  };
  tick();timer=setInterval(tick,200);
}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
const allReady=()=>!!(S&&S.phase==="hour"&&S.ready&&[1,2,3].every(n=>S.ready[n]));
function computeRanks(){
  const n=S.teams.length,kg=new Array(n).fill(0),fish=new Array(n).fill(0);
  S.catches.forEach(c=>{kg[c.t]+=c.kg;fish[c.t]++});
  for(let i=0;i<n;i++)kg[i]=Math.round(kg[i]*100)/100;
  const team={},sector={};
  for(const s of SECT){
    const list=S.teams.filter(t=>t.sec===s).sort((a,b)=>kg[b.id]-kg[a.id]||a.lake-b.lake);let i=0;
    while(i<list.length){let j=i;while(j+1<list.length&&kg[list[j+1].id]===kg[list[i].id])j++;const pts=(i+j+2)/2;for(let k=i;k<=j;k++)team[list[k].id]={pts,place:i+1};i=j+1}
    sector[s]=list;
  }
  const nat=COUNTRIES.map((c,ci)=>{const ts=S.teams.filter(t=>t.c===ci);return{ci,pts:ts.reduce((a,t)=>a+team[t.id].pts,0),kg:Math.round(ts.reduce((a,t)=>a+kg[t.id],0)*100)/100,fish:ts.reduce((a,t)=>a+fish[t.id],0)}});
  nat.sort((a,b)=>a.pts-b.pts||b.kg-a.kg||a.ci-b.ci);
  const natRank={};nat.forEach((x,i)=>natRank[x.ci]=i+1);
  return{kg,fish,team,sector,nat,natRank};
}
function rankSnapshot(){const R=computeRanks(),t={};for(const id in R.team)t[id]=R.team[id].place;return{t,n:R.natRank}}

/* naredbe s mobitela */
function handleCmd(m){
  if(!m||typeof m!=="object")return;
  const ph=S?S.phase:"none";
  switch(m.action){
    case "draw": if(ph==="none"||ph==="drawn"||ph==="done"){newGame();toast("Pozicije su izvučene")} break;
    case "start": if(ph==="drawn"){startHour(0);toast("Natjecanje je počelo")} break;
    case "next": if(ph==="hour"){finishHour();if(S.phase==="done")toast("Natjecanje je završeno")} break;
    case "add":{
      if(ph!=="hour")break;const t=S.teams[m.t];const kg=Math.round(+m.kg*100)/100;
      if(!t||t.cpu||!(kg>0&&kg<=40)||![1,2,3].includes(m.rod))break;
      if(S.catches.some(c=>c.t===t.id&&c.h===S.hour&&c.rod===m.rod))break;
      applyCatch({t:t.id,kg,rod:m.rod},true);saveState();break}
    case "ready":{
      if(ph!=="hour")break;S.ready=S.ready||{};
      const ns=m.n==="all"?[1,2,3]:Array.isArray(m.n)?m.n.map(Number):[+m.n];if(!ns.every(n=>[1,2,3].includes(n)))break;
      ns.forEach(n=>S.ready[n]=!!m.val);S.readySince=0;saveState();
      if(allReady()){toast(S.pending.length?"Svi su gotovi, čekaju se ostali ulovi":"Svi su gotovi");if(!timer)runTimer()}
      break}
    case "reset":{
      stopTimer();S=null;try{localStorage.removeItem(KEY_STATE)}catch(e){}
      tickerItems=[];lastRanks={};pegsKey="";$("tvProg").style.width="0";toast("Natjecanje je prekinuto");break}
    case "del": if(ph==="hour"){S.catches=S.catches.filter(c=>!(c.t===m.t&&c.h===S.hour&&c.rod===m.rod));tickerItems=S.catches.slice(-8).reverse().map(c=>({t:c.t,kg:c.kg,h:c.h}));saveState()} break;
  }
  renderTv();broadcast();
}
function phoneState(){
  if(!S)return{phase:"none"};
  const R=computeRanks();const nat=R.nat.find(x=>x.ci===0);
  const cro=S.teams.filter(t=>!t.cpu).map(t=>({id:t.id,n:t.n,name:tName(t),lake:t.lake,peg:t.peg,sec:t.sec,place:R.team[t.id].place,kg:R.kg[t.id],fish:R.fish[t.id],
    rods:[1,2,3].map(r=>{const c=S.catches.find(x=>x.t===t.id&&x.h===S.hour&&x.rod===r);return c?c.kg:null})}));
  const top=R.nat.map((x,i)=>({r:i+1,code:COUNTRIES[x.ci][0],name:COUNTRIES[x.ci][1],pts:x.pts,kg:x.kg,cro:x.ci===0}));
  return{phase:S.phase,hour:S.hour,pending:S.pending.length,ready:S.ready||{},nat:{rank:R.natRank[0],pts:nat.pts,kg:nat.kg,fish:nat.fish},cro,top};
}

function broadcast(){const msg={type:"state",s:phoneState()};conns.forEach(c=>{try{if(c.open)c.send(msg)}catch(e){}})}
function broadcastSoon(){if(bcTimer)return;bcTimer=setTimeout(()=>{bcTimer=null;broadcast()},700)}
function hostCode(){let c=fetchStore(KEY_CODE);if(!c){c=String(10000+Math.floor(Math.random()*90000));store(KEY_CODE,c)}return c}
function startHost(){
  if(typeof Peer==="undefined"){$("tvNet").textContent="Servis za spajanje nije dostupan. Provjerite internet i osvježite stranicu.";return}
  const code=hostCode();$("tvCode").textContent=code;
  const url=location.origin+location.pathname+"?c="+code;
  try{$("qr").innerHTML="";if(typeof QRCode!=="undefined")new QRCode($("qr"),{text:url,width:256,height:256,correctLevel:QRCode.CorrectLevel.M})}catch(e){}
  peer=new Peer(PEER_PREFIX+code,{debug:0});
  peer.on("open",()=>{$("tvNet").textContent="Spremno za spajanje";});
  peer.on("connection",conn=>{
    conn.on("open",()=>{conns.add(conn);renderConn();conn.send({type:"state",s:phoneState()})});
    conn.on("data",d=>{if(d&&d.type==="cmd")handleCmd(d)});
    conn.on("close",()=>{conns.delete(conn);renderConn()});
    conn.on("error",()=>{conns.delete(conn);renderConn()});
  });
  peer.on("disconnected",()=>{$("tvNet").textContent="Veza sa servisom prekinuta, ponovno spajanje…";setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
  peer.on("error",err=>{
    if(err.type==="unavailable-id"){store(KEY_CODE,"");try{peer.destroy()}catch(e){}setTimeout(startHost,500);return}
    $("tvNet").textContent="Greška veze: "+err.type;
  });
}
function renderConn(){
  const n=[...conns].filter(c=>c.open).length;
  $("tvConn").classList.toggle("on",n>0);
  $("tvConn").querySelector("span").textContent=n?`Mobitel spojen${n>1?" ("+n+")":""}`:"Mobitel nije spojen";
  $("tvQr").hidden=n>0&&S&&S.phase==="hour";
}

function buildMap(){
  const svg=$("map");
  svg.innerHTML=`<defs><radialGradient id="wg" cx="50%" cy="45%" r="65%"><stop offset="0" stop-color="var(--w1)"/><stop offset="1" stop-color="var(--w2)"/></radialGradient>

  <rect x="0" y="-15" width="1000" height="1150" fill="var(--bank)"/>
  <path id="lake" d="${LAKE}" fill="url(#wg)" stroke="var(--reed)" stroke-width="10" stroke-linejoin="round"/>
  <g id="secarcs"></g>
  <g><ellipse cx="500" cy="560" rx="62" ry="40" fill="var(--bank)" stroke="var(--reed)" stroke-width="5"/><circle cx="484" cy="552" r="13" fill="var(--reed)"/><circle cx="514" cy="558" r="10" fill="var(--reed)"/></g>
  <g id="secl"></g><g id="pegs"></g><g id="fx"></g>`;
  const lake=$("lake"),L=lake.getTotalLength();
  $("secarcs").innerHTML=SECT.map((s,k)=>`<path d="${LAKE}" fill="none" stroke="var(--${s})" stroke-width="5" stroke-dasharray="${L/3-6} ${L}" stroke-dashoffset="${-(k*L/3+3)}"/>`).join("");
  const inside=(x,y)=>{try{const p=svg.createSVGPoint();p.x=x;p.y=y;return lake.isPointInFill(p)}catch(e){return Math.hypot(x-500,y-540)<250}};
  const at=(s,off)=>{const a=lake.getPointAtLength((s+L)%L),b=lake.getPointAtLength((s+L-2)%L),c=lake.getPointAtLength((s+2)%L);
    let nx=c.y-b.y,ny=-(c.x-b.x);const m=Math.hypot(nx,ny)||1;nx/=m;ny/=m;if(inside(a.x+nx*6,a.y+ny*6)){nx=-nx;ny=-ny}
    return{x:a.x+nx*off,y:a.y+ny*off,wx:a.x-nx*42,wy:a.y-ny*42,nx,ny}};
  PEGPOS=[];for(let i=0;i<90;i++){const s=(i+.5)/90*L;const f=at(s,46),ax=Math.abs(f.nx),ay=Math.abs(f.ny);PEGPOS.push({...at(s,19),f,k:at(s,46+14*ax+9.5*ay+3+12*ax+6.5*ay)})}
  $("secl").innerHTML=SECT.map((s,k)=>{const p=at((k+.5)/3*L,-90);return `<text class="seclabel" x="${p.x}" y="${p.y}" fill="var(--${s})">${s}</text>`}).join("");
}

function animateCatch(t,kg){

  <g transform="translate(${p.wx} ${p.wy}) scale(${sc}) translate(${-p.wx} ${-p.wy})"><g class="jump"><path d="M${p.wx-11} ${p.wy}c6-7 16-7 22 0c-6 7-16 7-22 0zM${p.wx+10} ${p.wy}l8-6v12z" fill="${cro?"#fff":"#F4C770"}" stroke="${cro?"var(--cro)":"#7A5418"}" stroke-width="1.5"/></g></g>

const teamsLabel=ns=>ns.length===3?"sva tri tima":ns.length===2?`CT Croatia ${ns[0]} i ${ns[1]}`:`CT Croatia ${ns[0]}`;
function initMob(code){

function setMobConn(on,text){$("mConn").classList.toggle("on",on);$("mConn").querySelector("span").textContent=text}
function connectMob(){
  clearTimeout(retryT);
  if(typeof Peer==="undefined"){setMobConn(false,"Nema servisa");renderMob("Servis za spajanje nije dostupan. Provjerite internet.");return}
  store(KEY_LASTCODE,mCode);setMobConn(false,"Spajanje…");
  const go=()=>{
    try{if(mConn)mConn.close()}catch(e){}
    mConn=mPeer.connect(PEER_PREFIX+mCode,{reliable:true,serialization:"json"});
    mConn.on("open",()=>{setMobConn(true,"Spojeno s TV-om")});
    mConn.on("data",d=>{if(d&&d.type==="state"){MS=d.s;sent={};renderMob()}});
    mConn.on("close",()=>{setMobConn(false,"Veza prekinuta");retryT=setTimeout(go,2500)});
    mConn.on("error",()=>{setMobConn(false,"Veza prekinuta");retryT=setTimeout(go,2500)});
  };
  if(mPeer&&!mPeer.destroyed&&mPeer.open)return go();
  mPeer=new Peer({debug:0});
  mPeer.on("open",go);
  mPeer.on("error",err=>{
    if(err.type==="peer-unavailable"){setMobConn(false,"TV nije pronađen");renderMob("TV s tim kodom nije pronađen. Provjerite je li aplikacija otvorena na televizoru i kod točan.");retryT=setTimeout(go,4000);return}
    setMobConn(false,"Greška veze");
  });
  mPeer.on("disconnected",()=>{setTimeout(()=>{try{mPeer.reconnect()}catch(e){}},2000)});
}

  const po=$("pickOk");if(po)po.onclick=()=>{if(!pickSel.size)return;myTeam=[...pickSel].sort().join(",");store("carpwc-team",myTeam);renderMob()};
  const ch=$("chTeam");if(ch)ch.onclick=()=>{pickSel=new Set(myTeams());myTeam="";store("carpwc-team","");renderMob()};
  b.querySelectorAll("[data-ready]").forEach(el=>el.onclick=()=>send({action:"ready",n:myTeams(),val:el.dataset.ready==="1"}));
  b.querySelectorAll("[data-del]").forEach(el=>{const [t,r]=el.dataset.del.split("_").map(Number);el.onclick=()=>send({action:"del",t,rod:r})});
}

/* ===================== START ===================== */
const qs=new URLSearchParams(location.search);
if(qs.has("c"))initMob(qs.get("c").replace(/\D/g,"").slice(0,5));
else if(qs.has("tv"))initTv();
else{
  $("role").hidden=false;
  $("pickTv").onclick=()=>{$("role").hidden=true;initTv()};
  $("pickMob").onclick=()=>{$("role").hidden=true;initMob()};
}
</script>
</body>
</html>
